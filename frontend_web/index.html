<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Manajemen Produk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #e0f2ff, #fefefe);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Background cartoon */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        url("https://cdn-icons-png.flaticon.com/512/3081/3081559.png"),
        url("https://cdn-icons-png.flaticon.com/512/3081/3081648.png");
      background-size: 120px, 140px;
      background-repeat: no-repeat;
      background-position: left bottom, right top;
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    .card {
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.1);
      border: none;
    }

    .card-header {
      background: linear-gradient(135deg, #0d6efd, #0b5ed7);
      color: white;
      font-weight: bold;
    }

    .btn {
      border-radius: 14px;
      font-weight: 500;
    }

    table th {
      background: #0d6efd;
      color: white;
      text-align: center;
    }

    table td {
      vertical-align: middle;
    }

    .navbar {
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
  </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">📦 Sistem Manajemen Produk</span>
  </div>
</nav>

<div class="container">
  <div class="row g-4">

    <!-- FORM -->
    <div class="col-lg-4">
      <div class="card">
        <div class="card-header">Form Produk</div>
        <div class="card-body">
          <form id="productForm">
            <input type="hidden" id="id_produk">

            <div class="mb-2">
              <label class="form-label">Kode Produk</label>
              <input class="form-control" id="kode_produk" required>
            </div>

            <div class="mb-2">
              <label class="form-label">Nama Produk</label>
              <input class="form-control" id="nama_produk" required>
            </div>

            <div class="mb-2">
              <label class="form-label">Kategori</label>
              <input class="form-control" id="kategori">
            </div>

            <div class="mb-2">
              <label class="form-label">Stok</label>
              <input type="number" class="form-control" id="stok">
            </div>

            <div class="mb-2">
              <label class="form-label">Harga Beli</label>
              <input type="number" class="form-control" id="harga_beli">
            </div>

            <div class="mb-2">
              <label class="form-label">Harga Jual</label>
              <input type="number" class="form-control" id="harga_jual">
            </div>

            <div class="mb-3">
              <label class="form-label">Tanggal Kadaluarsa</label>
              <input type="date" class="form-control" id="tanggal_kadaluarsa">
            </div>

            <button class="btn btn-primary w-100">💾 Simpan Produk</button>
          </form>
        </div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header">Daftar Produk</div>
        <div class="card-body table-responsive">
          <table class="table table-hover align-middle text-center">
            <thead>
              <tr>
                <th>Kode</th>
                <th>Nama</th>
                <th>Kategori</th>
                <th>Stok</th>
                <th>Harga Beli</th>
                <th>Harga Jual</th>
                <th>Kadaluarsa</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const API = 'http://localhost:3000/api/produk';
const form = document.getElementById('productForm');
const tbody = document.getElementById('tableBody');

function loadData() {
  fetch(API)
    .then(res => res.json())
    .then(data => {
      tbody.innerHTML = '';
      data.forEach(p => {
        tbody.innerHTML += `
        <tr>
          <td>${p.kode_produk}</td>
          <td>${p.nama_produk}</td>
          <td>${p.kategori}</td>
          <td>${p.stok}</td>
          <td>Rp ${Number(p.harga_beli).toLocaleString()}</td>
          <td>Rp ${Number(p.harga_jual).toLocaleString()}</td>
          <td>${p.tanggal_kadaluarsa ? p.tanggal_kadaluarsa.split('T')[0] : '-'}</td>
          <td>
            <button class="btn btn-warning btn-sm" onclick='edit(${JSON.stringify(p)})'>✏️</button>
            <button class="btn btn-danger btn-sm" onclick='hapus(${p.id_produk})'>🗑️</button>
          </td>
        </tr>`;
      });
    });
}

form.onsubmit = e => {
  e.preventDefault();
  const id = id_produk.value;

  const data = {
    kode_produk: kode_produk.value,
    nama_produk: nama_produk.value,
    kategori: kategori.value,
    stok: stok.value,
    harga_beli: harga_beli.value,
    harga_jual: harga_jual.value,
    tanggal_kadaluarsa: tanggal_kadaluarsa.value
  };

  fetch(id ? `${API}/${id}` : API, {
    method: id ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(() => {
    form.reset();
    id_produk.value = '';
    loadData();
  });
};

function edit(p) {
  id_produk.value = p.id_produk;
  kode_produk.value = p.kode_produk;
  nama_produk.value = p.nama_produk;
  kategori.value = p.kategori;
  stok.value = p.stok;
  harga_beli.value = p.harga_beli;
  harga_jual.value = p.harga_jual;
  tanggal_kadaluarsa.value = p.tanggal_kadaluarsa ? p.tanggal_kadaluarsa.split('T')[0] : '';
}

function hapus(id) {
  if (confirm('Yakin hapus produk?')) {
    fetch(`${API}/${id}`, { method: 'DELETE' })
      .then(() => loadData());
  }
}

loadData();
</script>

</body>
</html>-
